# SaShip Daily Digest — GitHub Action
# Install this on the CLIENT DEV REPO (not the tracking repo).
#
# Required secrets (set on the client dev repo):
#   AI_GATEWAY_API_KEY   — Vercel AI Gateway API key for commit summarization
#   SLACK_WEBHOOK_URL    — Slack incoming webhook for daily digest
#   TRACKING_REPO_TOKEN  — GitHub PAT with repo write access to the tracking repo
#
# Required variables:
#   TRACKING_REPO        — e.g. "org/saship-tracking"
#   TRACKING_BRANCH      — e.g. "project-x"
#   COMMIT_PREFIX        — optional, e.g. "[project-x]": only commits carrying it reach
#                          the AI digest, the Slack post and the MDX updates. Leave it
#                          unset to feed every commit.
#
# Collection window: every commit since the last successful sync (`lastSync` in
# sync-log.json on the tracking repo), so weekends and failed runs are caught up
# by the next run. Falls back to the last 24h when there is no sync log yet.
#
# Large payloads (commit lists, base64 file bodies) travel through files, never
# through argv or env vars: Linux caps a single argument at 128 KiB, and
# commits.mdx outgrew that in July 2026 (`jq: Argument list too long`).

name: SaShip Daily Digest

on:
  schedule:
    - cron: "30 5 * * 1-5" # Weekdays at ~7:30 AM CET (5:30 UTC + GH Actions delay)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout client repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches
        run: git fetch --all

      - name: Collect commits since the last sync
        id: commits
        env:
          TRACKING_REPO_TOKEN: ${{ secrets.TRACKING_REPO_TOKEN }}
          TRACKING_REPO: ${{ vars.TRACKING_REPO }}
          TRACKING_BRANCH: ${{ vars.TRACKING_BRANCH }}
        run: |
          TRACKING_REPO_TOKEN=$(printf '%s' "$TRACKING_REPO_TOKEN" | tr -d '\n\r')
          PREFIX="${{ vars.COMMIT_PREFIX }}"
          echo "::group::Commit collection"

          # Window: [lastSync, now). The upper bound is frozen here and becomes the next
          # lastSync, so a commit pushed while this job runs is picked up next time.
          UNTIL=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          FLOOR=$(date -u -d "90 days ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-90d +%Y-%m-%dT%H:%M:%SZ)
          LAST_SYNC=$(curl -s \
            -H "Authorization: token $TRACKING_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$TRACKING_REPO/contents/sync-log.json?ref=$TRACKING_BRANCH" \
            | jq -r '.content // empty' | base64 -d 2>/dev/null | jq -r '.lastSync // empty' 2>/dev/null || true)

          if [[ "$LAST_SYNC" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            SINCE="$LAST_SYNC"
            # Never reach back more than 90 days, however long the outage was.
            if [[ "$SINCE" < "$FLOOR" ]]; then SINCE="$FLOOR"; fi
          else
            SINCE=$(date -u -d "24 hours ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)
          fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "until=$UNTIL" >> "$GITHUB_OUTPUT"
          echo "Looking for commits from $SINCE to $UNTIL (last sync: ${LAST_SYNC:-none})"

          # Get ALL commits from all branches (for the commit log page). Fields are
          # separated by 0x1f so a "|" in a subject cannot shift them.
          git log --all --since="$SINCE" --until="$UNTIL" \
            --pretty=format:'%H%x1f%cs%x1f%an%x1f%s' > /tmp/all_commits.txt || true
          jq -R -s '
            split("\n") | map(select(length > 0) | split("\u001f")
              | {hash: .[0], date: .[1], author: .[2], message: (.[3:] | join("\u001f"))})
          ' /tmp/all_commits.txt > /tmp/all_commits.json

          ALL_COUNT=$(jq 'length' /tmp/all_commits.json)
          if [ "$ALL_COUNT" = "0" ]; then
            echo "no_all_commits=true" >> "$GITHUB_OUTPUT"
            echo "no_commits=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No commits found since $SINCE"
            echo "::endgroup::"
            exit 0
          fi

          echo "no_all_commits=false" >> "$GITHUB_OUTPUT"
          echo "Found $ALL_COUNT total commit(s)"

          # Get prefix-filtered commits (for AI matching and MDX updates)
          jq --arg p "$PREFIX" '[.[] | select(.message | contains($p))]' /tmp/all_commits.json > /tmp/prefixed_commits.json
          COMMIT_COUNT=$(jq 'length' /tmp/prefixed_commits.json)

          if [ "$COMMIT_COUNT" = "0" ]; then
            echo "no_commits=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No commits with prefix $PREFIX found (but $ALL_COUNT total commits logged)"
            echo "::endgroup::"
            exit 0
          fi

          echo "Found $COMMIT_COUNT prefixed commit(s)"
          jq -r '.[] | .hash[0:9] + " " + .message' /tmp/prefixed_commits.json
          echo "no_commits=false" >> "$GITHUB_OUTPUT"

          # Determine environment by checking which branches contain each commit
          jq -c '.[]' /tmp/prefixed_commits.json | while IFS= read -r commit; do
            HASH=$(echo "$commit" | jq -r '.hash')
            BRANCHES=$(git branch -a --contains "$HASH" 2>/dev/null || true)
            if echo "$BRANCHES" | grep -qE "main$|master$|production$|remotes/origin/main$|remotes/origin/master$|remotes/origin/production$"; then
              ENV="prod"
              STATUS="deployed"
            elif echo "$BRANCHES" | grep -qE "staging$|remotes/origin/staging$"; then
              ENV="staging"
              STATUS="in-staging"
            else
              ENV="dev"
              STATUS="in-development"
            fi
            echo "$commit" | jq --arg e "$ENV" --arg s "$STATUS" \
              '{hash, author, message, env: $e, status: $s}'
          done | jq -s '.' > /tmp/commits.json

          echo "Commits JSON:"
          cat /tmp/commits.json
          echo "::endgroup::"

      - name: Update commit log on tracking repo
        id: commitlog
        if: steps.commits.outputs.no_all_commits != 'true'
        env:
          TRACKING_REPO_TOKEN: ${{ secrets.TRACKING_REPO_TOKEN }}
          TRACKING_REPO: ${{ vars.TRACKING_REPO }}
          TRACKING_BRANCH: ${{ vars.TRACKING_BRANCH }}
        run: |
          TRACKING_REPO_TOKEN=$(printf '%s' "$TRACKING_REPO_TOKEN" | tr -d '\n\r')
          echo "::group::Update commit log"

          COMMIT_COUNT=$(jq 'length' /tmp/all_commits.json)
          echo "Adding $COMMIT_COUNT commit(s) to commit log"

          # Fetch current commits.mdx: sha from the JSON API, body from the raw media
          # type (the JSON API stops inlining file content above 1 MB).
          FILE_PATH="content/commits.mdx"
          FILE_URL="https://api.github.com/repos/$TRACKING_REPO/contents/$FILE_PATH?ref=$TRACKING_BRANCH"
          SHA=$(curl -s \
            -H "Authorization: token $TRACKING_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "$FILE_URL" | jq -r '.sha // empty')
          HTTP=$(curl -s -o /tmp/commits_current.mdx -w "%{http_code}" \
            -H "Authorization: token $TRACKING_REPO_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "$FILE_URL")
          if [ "$HTTP" = "404" ]; then
            : > /tmp/commits_current.mdx
          elif [ "$HTTP" != "200" ]; then
            echo "::error::Could not read $FILE_PATH (HTTP $HTTP) — leaving it untouched"
            exit 1
          fi

          # Merge the new commits in: one "### YYYY-MM-DD" section per commit date,
          # newest first, project prefix stripped. A date that already has a section
          # gets the new lines on top of it instead of a second heading.
          python3 - <<'PY'
          import json, re
          from collections import OrderedDict

          commits = json.load(open("/tmp/all_commits.json", encoding="utf-8"))
          lines = open("/tmp/commits_current.mdx", encoding="utf-8").read().split("\n")

          if "## Commit Log" in lines:
              i = lines.index("## Commit Log")
              head, body = lines[: i + 1], lines[i + 1 :]
          else:
              head, body = [l for l in lines if l.strip()] + ["## Commit Log"], []

          preamble, sections, date = [], OrderedDict(), None
          for line in body:
              m = re.match(r"^### (\d{4}-\d{2}-\d{2})\s*$", line)
              if m:
                  date = m.group(1)
                  sections.setdefault(date, [])
              elif date is None:
                  preamble.append(line)
              else:
                  sections[date].append(line)

          new = OrderedDict()
          for c in commits:  # git log order: newest first
              message = re.sub(r"^\[.*?\] *", "", c["message"], count=1)
              new.setdefault(c["date"], []).append(f"- {message} — *{c['author']}*")
          for d, entries in new.items():
              sections[d] = entries + sections.get(d, [])

          out = head + [l for l in preamble if l.strip()]
          for d in sorted(sections, reverse=True):
              out.append(f"### {d}")
              out.extend(l for l in sections[d] if l.strip())
          with open("/tmp/commits_updated.mdx", "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          print(f"{len(new)} day(s) touched, {len(sections)} day(s) in the log")
          PY

          # Push updated file (base64 body goes through a file: see header note)
          base64 -w 0 /tmp/commits_updated.mdx > /tmp/commits_updated.b64
          jq -n --arg msg "[bot] update: commit-log $(date +%Y-%m-%d)" \
            --rawfile content /tmp/commits_updated.b64 \
            --arg branch "$TRACKING_BRANCH" \
            --arg sha "$SHA" \
            'if $sha == "" then {message:$msg, content:$content, branch:$branch}
             else {message:$msg, content:$content, branch:$branch, sha:$sha} end' \
            > /tmp/commits_payload.json

          if GH_TOKEN="$TRACKING_REPO_TOKEN" gh api \
            -X PUT \
            "/repos/$TRACKING_REPO/contents/$FILE_PATH" \
            --input /tmp/commits_payload.json > /tmp/commits_response.json 2>&1; then
            echo "Updated $FILE_PATH with $COMMIT_COUNT new commit(s)"
          else
            echo "::error::Failed to update $FILE_PATH"
            cat /tmp/commits_response.json
            # Fail the step: the sync log then keeps its lastSync and the next run retries.
            exit 1
          fi
          echo "::endgroup::"

      - name: Fetch roadmap context from tracking repo
        if: steps.commits.outputs.no_commits != 'true'
        id: roadmap
        env:
          TRACKING_REPO_TOKEN: ${{ secrets.TRACKING_REPO_TOKEN }}
          TRACKING_REPO: ${{ vars.TRACKING_REPO }}
          TRACKING_BRANCH: ${{ vars.TRACKING_BRANCH }}
        run: |
          # Sanitize token (strip stray newlines/carriage returns)
          TRACKING_REPO_TOKEN=$(printf '%s' "$TRACKING_REPO_TOKEN" | tr -d '\n\r')

          echo "::group::Fetch roadmap context"

          # Fetch project.config.json
          CONFIG_RESP=$(curl -s \
            -H "Authorization: token $TRACKING_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$TRACKING_REPO/contents/project.config.json?ref=$TRACKING_BRANCH")

          PROJECT_CONFIG=$(echo "$CONFIG_RESP" | jq -r '.content // empty' | base64 -d 2>/dev/null || echo '{}')
          echo "Project config fetched: $(echo "$PROJECT_CONFIG" | jq -r '.project // "unknown"')"

          # Fetch list of content/*.mdx files
          CONTENT_RESP=$(curl -s \
            -H "Authorization: token $TRACKING_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$TRACKING_REPO/contents/content?ref=$TRACKING_BRANCH")

          # For each MDX file, fetch its frontmatter
          ROADMAP_ENTRIES="[]"
          for FILE_URL in $(echo "$CONTENT_RESP" | jq -r '.[]? | select(.name | endswith(".mdx") and .name != "commits.mdx") | .url'); do
            FILE_DATA=$(curl -s \
              -H "Authorization: token $TRACKING_REPO_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "$FILE_URL?ref=$TRACKING_BRANCH")

            FILENAME=$(echo "$FILE_DATA" | jq -r '.name')
            SLUG="${FILENAME%.mdx}"
            FILE_CONTENT=$(echo "$FILE_DATA" | jq -r '.content // empty' | base64 -d 2>/dev/null || true)

            if [ -n "$FILE_CONTENT" ]; then
              # Extract frontmatter fields
              TITLE=$(echo "$FILE_CONTENT" | sed -n '/^---$/,/^---$/p' | grep '^title:' | sed 's/^title: *//')
              OWNER=$(echo "$FILE_CONTENT" | sed -n '/^---$/,/^---$/p' | grep '^owner:' | sed 's/^owner: *//')
              STATUS=$(echo "$FILE_CONTENT" | sed -n '/^---$/,/^---$/p' | grep '^status:' | sed 's/^status: *//')
              ENV=$(echo "$FILE_CONTENT" | sed -n '/^---$/,/^---$/p' | grep '^environment:' | sed 's/^environment: *//')

              ROADMAP_ENTRIES=$(echo "$ROADMAP_ENTRIES" | jq --arg s "$SLUG" --arg t "$TITLE" --arg o "$OWNER" --arg st "$STATUS" --arg e "$ENV" \
                '. + [{slug: $s, title: $t, owner: $o, status: $st, environment: $e}]')
            fi
          done

          echo "Found $(echo "$ROADMAP_ENTRIES" | jq 'length') existing roadmap entries"
          echo "$ROADMAP_ENTRIES" | jq '.'

          # Fetch content/roadmap.json (sprint plan — single source of truth for deliverables per dev)
          SCHEDULE_RESP=$(curl -s \
            -H "Authorization: token $TRACKING_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$TRACKING_REPO/contents/content/roadmap.json?ref=$TRACKING_BRANCH")

          SCHEDULE=$(echo "$SCHEDULE_RESP" | jq -r '.content // empty' | base64 -d 2>/dev/null || echo '{"startDate":"","weeks":[]}')
          echo "Roadmap fetched: $(echo "$SCHEDULE" | jq '.weeks | length') weeks, startDate=$(echo "$SCHEDULE" | jq -r '.startDate')"

          # Fetch content/extras.json (additional developments)
          EXTRAS_RESP=$(curl -s \
            -H "Authorization: token $TRACKING_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$TRACKING_REPO/contents/content/extras.json?ref=$TRACKING_BRANCH")

          EXTRAS=$(echo "$EXTRAS_RESP" | jq -r '.content // empty' | base64 -d 2>/dev/null || echo '[]')
          echo "Extras fetched: $(echo "$EXTRAS" | jq 'length') items"

          # Write to temp files for the next step (files, not step outputs: see header note)
          echo "$PROJECT_CONFIG" > /tmp/project_config.json
          echo "$ROADMAP_ENTRIES" > /tmp/roadmap_entries.json
          echo "$SCHEDULE" > /tmp/schedule.json
          echo "$EXTRAS" > /tmp/extras.json

          echo "::endgroup::"

      - name: Summarize with AI Gateway
        if: steps.commits.outputs.no_commits != 'true'
        id: summary
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          SINCE: ${{ steps.commits.outputs.since }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)

          # The window runs from the last sync: a Monday digest covers the whole weekend,
          # so it must not call three days of work "hier".
          SINCE_DAY="${SINCE:0:10}"
          if [ -z "$SINCE_DAY" ] || [[ ! "$SINCE_DAY" < "$YESTERDAY" ]]; then
            PERIOD="$YESTERDAY"
            DELIVERED="hier"
          else
            PERIOD="du $SINCE_DAY au $YESTERDAY"
            DELIVERED="depuis le $SINCE_DAY"
          fi

          # Read the inputs from the files the previous steps wrote (not env vars: see header note)
          COMMITS=$(cat /tmp/commits.json)
          CONFIG=$(cat /tmp/project_config.json)
          ROADMAP=$(cat /tmp/roadmap_entries.json)
          SCHEDULE=$(cat /tmp/schedule.json)
          EXTRAS=$(cat /tmp/extras.json)

          # Build the prompt as a file to avoid shell quoting issues
          cat > /tmp/ai_prompt.txt <<PROMPT_EOF
          Tu es un assistant de suivi de livraisons pour un projet SaaS. Tu as le contexte complet de la roadmap du projet.

          CONFIGURATION DU PROJET :
          $CONFIG

          PLANNING DES SPRINTS (livrables par dev par semaine — source unique de verite) :
          $SCHEDULE

          LIVRABLES EXISTANTS DE LA ROADMAP (etat actuel des fichiers MDX) :
          $ROADMAP

          COMMITS DU JOUR :
          $COMMITS

          DEVELOPPEMENTS SUPPLEMENTAIRES (demandes client hors roadmap) :
          $EXTRAS

          INSTRUCTIONS :
          1. Associe chaque commit a un livrable EXISTANT de la roadmap en utilisant le slug exact des entrees roadmap ci-dessus.
          2. Si un commit correspond clairement a un livrable du PLANNING DES SPRINTS qui n'a PAS encore de fichier MDX, cree une nouvelle entree en suivant la convention : kebab-case-titre-prenomdev (ex: "finances-ai-onboarding-wizard-leonard").
          3. Si un commit ne correspond clairement a AUCUN livrable, IGNORE-LE — ne force pas d'association. Inclus-le uniquement dans le digest Slack sous une section "Autres changements".
          4. NE determine PAS le statut toi-meme. Chaque commit a deja un champ "status" derive de sa branche (staging = "in-staging", main/production = "deployed"). Utilise cette valeur telle quelle.
          5. Pour le champ "owner", utilise TOUJOURS le prenom exact tel qu'il apparait dans le PLANNING DES SPRINTS, PAS le nom complet de l'auteur du commit git. Fais correspondre l'auteur du commit au dev le plus proche dans le planning.
          6. Pour le champ "title" des NOUVEAUX fichiers, utilise EXACTEMENT le titre tel qu'il apparait dans le PLANNING DES SPRINTS. Ne traduis pas et n'invente pas de titre different.
          7. Ecris une entree de changelog EN FRANCAIS pour chaque livrable associe. N'inclus PAS le nom de l'auteur dans l'entree (le owner est deja dans le frontmatter et affiche par colonne). Format :
             ### $TODAY
             <resume concis en francais>
          8. Ecris un digest Slack quotidien EN FRANCAIS en utilisant la syntaxe Slack mrkdwn (PAS du markdown standard). Regles mrkdwn Slack : *gras* (asterisque simple), _italique_ (underscores), pas de ## titres (utilise *texte en gras* sur sa propre ligne), puces avec •. Groupe par developpeur, puis par environnement. IMPORTANT : N'utilise PAS de termes techniques comme [PROD], [STAGING], [DEV]. Utilise des termes simples : pour prod/deployed ecris "En production", pour staging ecris "En validation (staging)", pour dev ecris "En développement". Le titre du message doit etre "Suivi des livraisons — $PERIOD" (recopie cette periode telle quelle : ce sont les dates des commits rapportes, pas la date d'aujourd'hui). En bas du message, ecris "X changement(s) livré(s) $DELIVERED" (PAS "aujourd'hui"). Ecris en francais avec un langage simple et non-technique.
          9. Si un commit resout ou complete clairement un element des DEVELOPPEMENTS SUPPLEMENTAIRES, inclus-le dans "extras_updates" avec l'"id" exact de l'element et le statut "done". Ne marque comme done que si le commit traite reellement l'extra — ne force pas d'associations.

          Reponds au format JSON :
          {
            "slack_message": "<digest formate en slack markdown, en francais>",
            "mdx_updates": [
              {
                "deliverable_slug": "<slug exact de la roadmap ou nouveau slug kebab-case>",
                "title": "<titre du livrable — uniquement pour les nouveaux fichiers>",
                "owner": "<prenom exact du dev depuis le planning>",
                "environment": "<staging|prod du commit>",
                "status": "<in-staging|deployed du commit>",
                "entry": "### $TODAY\n<resume en francais>"
              }
            ],
            "extras_updates": [
              {
                "id": "<id exact de l'extra>",
                "status": "done"
              }
            ]
          }

          Si aucun commit ne correspond a un livrable, renvoie un tableau mdx_updates vide.
          Si aucun commit ne resout un extra, renvoie un tableau extras_updates vide.
          IMPORTANT : Reponds uniquement en JSON brut. N'encadre PAS ta reponse dans des blocs de code markdown.
          PROMPT_EOF

          echo "::group::AI Gateway request"
          echo "Calling AI Gateway (model: anthropic/claude-haiku-4-5)"

          # Build request JSON to a file, then send with @file
          jq -n --rawfile content /tmp/ai_prompt.txt '{model:"anthropic/claude-haiku-4-5",max_tokens:8192,messages:[{role:"user",content:$content}]}' > /tmp/ai_request.json

          HTTP_CODE=$(curl -s -o /tmp/ai_response.json -w "%{http_code}" \
            https://ai-gateway.vercel.sh/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $AI_GATEWAY_API_KEY" \
            -d @/tmp/ai_request.json)

          RESPONSE=$(cat /tmp/ai_response.json)
          echo "AI Gateway HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::AI Gateway returned HTTP $HTTP_CODE"
            echo "Response body: $RESPONSE"
            echo "::endgroup::"
            exit 1
          fi

          # Extract the text content (OpenAI-compatible response format)
          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          # Strip markdown code blocks if the model wrapped JSON in ```json ... ```
          CONTENT=$(echo "$CONTENT" | sed '/^```\(json\)\?$/d')

          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "::error::AI Gateway returned empty content"
            echo "Raw response: $RESPONSE"
            echo "::endgroup::"
            exit 1
          fi

          echo "AI Gateway response received (${#CONTENT} chars)"

          # Write cleaned content to temp file for downstream steps
          echo "$CONTENT" > /tmp/ai_content.json

          # Validate JSON
          if ! jq . /tmp/ai_content.json > /dev/null 2>&1; then
            echo "::error::AI response is not valid JSON"
            echo "Content: $CONTENT"
            echo "::endgroup::"
            exit 1
          fi

          echo "AI content validated as JSON"
          echo "::endgroup::"

      - name: Post to Slack
        if: steps.commits.outputs.no_commits != 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SLACK_MSG=$(jq -r '.slack_message // empty' /tmp/ai_content.json)

          if [ -z "$SLACK_MSG" ]; then
            echo "::warning::No slack_message found in AI response — skipping Slack post"
            exit 0
          fi

          echo "::group::Slack post"
          SLACK_PAYLOAD=$(jq -n --arg text "$SLACK_MSG" '{text: $text}')
          SLACK_HTTP=$(curl -s -o /tmp/slack_response.txt -w "%{http_code}" \
            -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$SLACK_PAYLOAD") || true

          echo "Slack HTTP status: $SLACK_HTTP"
          if [ "$SLACK_HTTP" != "200" ]; then
            echo "::warning::Slack webhook returned HTTP $SLACK_HTTP (non-blocking)"
            cat /tmp/slack_response.txt 2>/dev/null || true
          else
            echo "Slack digest posted successfully"
          fi
          echo "::endgroup::"

      - name: Update tracking repo MDX files
        if: steps.commits.outputs.no_commits != 'true'
        env:
          TRACKING_REPO_TOKEN: ${{ secrets.TRACKING_REPO_TOKEN }}
          TRACKING_REPO: ${{ vars.TRACKING_REPO }}
          TRACKING_BRANCH: ${{ vars.TRACKING_BRANCH }}
        run: |
          # Sanitize token (strip stray newlines/carriage returns)
          TRACKING_REPO_TOKEN=$(printf '%s' "$TRACKING_REPO_TOKEN" | tr -d '\n\r')

          UPDATE_COUNT=$(jq '.mdx_updates | length' /tmp/ai_content.json)
          echo "::group::MDX updates ($UPDATE_COUNT file(s))"

          if [ "$UPDATE_COUNT" = "0" ]; then
            echo "No deliverable updates — all commits were unmatched"
            echo "::endgroup::"
            exit 0
          fi

          jq -c '.mdx_updates[]' /tmp/ai_content.json | while read -r update; do
            SLUG=$(echo "$update" | jq -r '.deliverable_slug')
            ENTRY=$(echo "$update" | jq -r '.entry')
            OWNER=$(echo "$update" | jq -r '.owner')
            ENV=$(echo "$update" | jq -r '.environment')
            STATUS=$(echo "$update" | jq -r '.status')
            TITLE=$(echo "$update" | jq -r '.title // empty')
            FILE_PATH="content/${SLUG}.mdx"

            echo "--- Updating $FILE_PATH on $TRACKING_REPO@$TRACKING_BRANCH (status=$STATUS, env=$ENV, owner=$OWNER)"

            # Get current file content (if exists)
            EXISTING=$(curl -s \
              -H "Authorization: token $TRACKING_REPO_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$TRACKING_REPO/contents/$FILE_PATH?ref=$TRACKING_BRANCH")

            SHA=$(echo "$EXISTING" | jq -r '.sha // empty')
            CURRENT_CONTENT=$(echo "$EXISTING" | jq -r '.content // empty' | base64 -d 2>/dev/null || true)

            if [ -n "$CURRENT_CONTENT" ]; then
              # Insert new entry after "## Changelog" line using temp file (avoids awk newline issues)
              printf '\n%s\n' "$ENTRY" > /tmp/changelog_entry.txt
              echo "$CURRENT_CONTENT" | sed '/^## Changelog$/r /tmp/changelog_entry.txt' > /tmp/mdx_updated.txt
              # Update frontmatter status and environment
              sed -i "s/^status: .*/status: $STATUS/" /tmp/mdx_updated.txt
              sed -i "s/^environment: .*/environment: $ENV/" /tmp/mdx_updated.txt
            else
              # Create new file — use title from AI response or derive from slug
              if [ -z "$TITLE" ]; then
                TITLE=$(echo "$SLUG" | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2))}1')
              fi
              printf '%s\n%s\n%s\n%s\n%s\n%s\n\n%s\n\n%s\n' \
                "---" \
                "title: $TITLE" \
                "owner: $OWNER" \
                "status: $STATUS" \
                "environment: $ENV" \
                "---" \
                "## Changelog" \
                "$ENTRY" > /tmp/mdx_updated.txt
            fi

            # Validate MDX (basic check — ensure frontmatter is intact)
            if ! head -1 /tmp/mdx_updated.txt | grep -q "^---$"; then
              echo "ERROR: Invalid MDX for $SLUG — skipping"
              continue
            fi

            # Build payload: base64 encode the file, then build JSON with jq
            base64 -w 0 /tmp/mdx_updated.txt > /tmp/mdx_updated.b64
            jq -n --arg msg "update: $SLUG digest $(date +%Y-%m-%d)" \
              --rawfile content /tmp/mdx_updated.b64 \
              --arg branch "$TRACKING_BRANCH" \
              --arg sha "$SHA" \
              'if $sha == "" then {message:$msg, content:$content, branch:$branch}
               else {message:$msg, content:$content, branch:$branch, sha:$sha} end' \
              > /tmp/mdx_payload.json

            if GH_TOKEN="$TRACKING_REPO_TOKEN" gh api \
              -X PUT \
              "/repos/$TRACKING_REPO/contents/$FILE_PATH" \
              --input /tmp/mdx_payload.json > /tmp/mdx_response.json 2>&1; then
              echo "Updated $FILE_PATH"
            else
              echo "::error::Failed to update $FILE_PATH"
              cat /tmp/mdx_response.json
            fi
          done
          echo "::endgroup::"

      - name: Update extras.json on tracking repo
        if: steps.commits.outputs.no_commits != 'true'
        continue-on-error: true
        env:
          TRACKING_REPO_TOKEN: ${{ secrets.TRACKING_REPO_TOKEN }}
          TRACKING_REPO: ${{ vars.TRACKING_REPO }}
          TRACKING_BRANCH: ${{ vars.TRACKING_BRANCH }}
        run: |
          TRACKING_REPO_TOKEN=$(printf '%s' "$TRACKING_REPO_TOKEN" | tr -d '\n\r')
          echo "::group::Extras update"

          EXTRAS_COUNT=$(jq '.extras_updates // [] | length' /tmp/ai_content.json)

          if [ "$EXTRAS_COUNT" = "0" ] || [ "$EXTRAS_COUNT" = "null" ]; then
            echo "No extras updates"
            echo "::endgroup::"
            exit 0
          fi

          echo "Processing $EXTRAS_COUNT extras update(s)"

          # Fetch current extras.json
          FILE_PATH="content/extras.json"
          EXISTING=$(curl -s \
            -H "Authorization: token $TRACKING_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$TRACKING_REPO/contents/$FILE_PATH?ref=$TRACKING_BRANCH")

          SHA=$(echo "$EXISTING" | jq -r '.sha // empty')
          CURRENT=$(echo "$EXISTING" | jq -r '.content // empty' | base64 -d 2>/dev/null || echo '[]')

          # Apply status updates from AI response
          UPDATED="$CURRENT"
          jq -c '.extras_updates // [] | .[]' /tmp/ai_content.json | while read -r update; do
            EID=$(echo "$update" | jq -r '.id')
            ESTATUS=$(echo "$update" | jq -r '.status')
            echo "  Marking extra '$EID' as $ESTATUS"
            UPDATED=$(echo "$UPDATED" | jq --arg id "$EID" --arg status "$ESTATUS" \
              'map(if .id == $id then .status = $status else . end)')
            echo "$UPDATED" > /tmp/extras_updated.json
          done

          # Read the final result (the while loop runs in a subshell)
          if [ ! -f /tmp/extras_updated.json ]; then
            echo "No changes applied"
            echo "::endgroup::"
            exit 0
          fi

          # Push updated extras.json
          jq -c '.' /tmp/extras_updated.json | base64 -w 0 > /tmp/extras_updated.b64
          jq -n --arg msg "[bot] update: extras $(date +%Y-%m-%d)" \
            --rawfile content /tmp/extras_updated.b64 \
            --arg branch "$TRACKING_BRANCH" \
            --arg sha "$SHA" \
            'if $sha == "" then {message:$msg, content:$content, branch:$branch}
             else {message:$msg, content:$content, branch:$branch, sha:$sha} end' \
            > /tmp/extras_payload.json

          if GH_TOKEN="$TRACKING_REPO_TOKEN" gh api \
            -X PUT \
            "/repos/$TRACKING_REPO/contents/$FILE_PATH" \
            --input /tmp/extras_payload.json > /tmp/extras_response.json 2>&1; then
            echo "Updated $FILE_PATH"
          else
            echo "::error::Failed to update $FILE_PATH"
            cat /tmp/extras_response.json
          fi
          echo "::endgroup::"

      - name: Update stats.json with lines per dev
        if: steps.commits.outputs.no_commits != 'true'
        env:
          TRACKING_REPO_TOKEN: ${{ secrets.TRACKING_REPO_TOKEN }}
          TRACKING_REPO: ${{ vars.TRACKING_REPO }}
          TRACKING_BRANCH: ${{ vars.TRACKING_BRANCH }}
        run: |
          # Sanitize token (strip stray newlines/carriage returns)
          TRACKING_REPO_TOKEN=$(printf '%s' "$TRACKING_REPO_TOKEN" | tr -d '\n\r')

          COMMITS=$(cat /tmp/commits.json)
          echo "::group::Stats update"

          # Count lines added per author from today's commits
          LINES_TODAY=$(echo "$COMMITS" | jq -r '.[] | .author + "|" + .hash' | while read -r entry; do
            AUTHOR=$(echo "$entry" | cut -d'|' -f1)
            HASH=$(echo "$entry" | cut -d'|' -f2)
            ADDED=$(git show --stat "$HASH" 2>/dev/null | tail -1 | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo 0)
            echo "$AUTHOR|$ADDED"
          done | awk -F'|' '{a[$1]+=$2} END {for(k in a) printf "%s|%d\n",k,a[k]}')

          # Get current stats.json
          EXISTING=$(curl -s \
            -H "Authorization: token $TRACKING_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$TRACKING_REPO/contents/stats.json?ref=$TRACKING_BRANCH")

          SHA=$(echo "$EXISTING" | jq -r '.sha // empty')
          CURRENT=$(echo "$EXISTING" | jq -r '.content // empty' | base64 -d 2>/dev/null || echo '{"daily":[],"lastUpdated":""}')

          # Build today's daily entry: {"date":"2026-02-18","Quentin":150,"Leonard":200}
          TODAY=$(date +%Y-%m-%d)
          echo '{}' | jq --arg d "$TODAY" '{date: $d}' > /tmp/today_entry.json

          while IFS='|' read -r dev lines; do
            [ -z "$dev" ] && continue
            jq --arg d "$dev" --argjson l "$lines" '.[$d] = $l' /tmp/today_entry.json > /tmp/today_tmp.json \
              && mv /tmp/today_tmp.json /tmp/today_entry.json
          done <<< "$LINES_TODAY"

          # Append today's entry to daily array (replace if same date exists) and update lastUpdated
          ENTRY=$(cat /tmp/today_entry.json)
          echo "$CURRENT" | jq --argjson entry "$ENTRY" --arg date "$TODAY" \
            '(.daily | map(select(.date != $date))) + [$entry] | {daily: ., lastUpdated: $date}' \
            > /tmp/stats_updated.json

          # Push updated stats.json
          jq -c '.' /tmp/stats_updated.json | base64 -w 0 > /tmp/stats_updated.b64
          jq -n --arg msg "stats: update $(date +%Y-%m-%d)" \
            --rawfile content /tmp/stats_updated.b64 \
            --arg branch "$TRACKING_BRANCH" \
            --arg sha "$SHA" \
            'if $sha == "" then {message:$msg, content:$content, branch:$branch}
             else {message:$msg, content:$content, branch:$branch, sha:$sha} end' \
            > /tmp/stats_payload.json

          if GH_TOKEN="$TRACKING_REPO_TOKEN" gh api \
            -X PUT \
            "/repos/$TRACKING_REPO/contents/stats.json" \
            --input /tmp/stats_payload.json > /tmp/stats_response.json 2>&1; then
            echo "Updated stats.json"
          else
            echo "::error::Failed to update stats.json"
            cat /tmp/stats_response.json
          fi
          echo "::endgroup::"

      - name: Update sync log
        # Runs whenever the commit log was written, even if a later step failed:
        # lastSync has to move with the commit log, or the next run logs the same
        # commits twice.
        if: ${{ !cancelled() && steps.commitlog.outcome == 'success' }}
        env:
          TRACKING_REPO_TOKEN: ${{ secrets.TRACKING_REPO_TOKEN }}
          TRACKING_REPO: ${{ vars.TRACKING_REPO }}
          TRACKING_BRANCH: ${{ vars.TRACKING_BRANCH }}
          UNTIL: ${{ steps.commits.outputs.until }}
        run: |
          TRACKING_REPO_TOKEN=$(printf '%s' "$TRACKING_REPO_TOKEN" | tr -d '\n\r')
          echo "::group::Sync log update"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TODAY=$(date +%Y-%m-%d)

          COMMIT_COUNT=$(jq 'length' /tmp/all_commits.json)
          if [ -f /tmp/ai_content.json ]; then
            MDX_COUNT=$(jq '.mdx_updates | length // 0' /tmp/ai_content.json)
            FILES_TOUCHED=$(jq -r '[.mdx_updates[]?.deliverable_slug] | join(", ")' /tmp/ai_content.json)
          else
            MDX_COUNT=0
            FILES_TOUCHED=""
          fi

          # Get current sync-log.json
          EXISTING=$(curl -s \
            -H "Authorization: token $TRACKING_REPO_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$TRACKING_REPO/contents/sync-log.json?ref=$TRACKING_BRANCH")

          SHA=$(echo "$EXISTING" | jq -r '.sha // empty')
          CURRENT=$(echo "$EXISTING" | jq -r '.content // empty' | base64 -d 2>/dev/null || echo '{"lastSync":"","runs":[]}')

          # Build new run entry
          NEW_RUN=$(jq -n \
            --arg ts "$NOW" \
            --argjson commits "$COMMIT_COUNT" \
            --argjson mdx "$MDX_COUNT" \
            --arg files "$FILES_TOUCHED" \
            '{timestamp: $ts, commitsProcessed: $commits, filesUpdated: $mdx, deliverables: $files}')

          # Append run (keep last 30 entries). lastSync is the end of the window this run
          # collected, which is where the next run starts.
          UPDATED=$(echo "$CURRENT" | jq --argjson run "$NEW_RUN" --arg ts "${UNTIL:-$NOW}" \
            '{lastSync: $ts, runs: ([.runs[], $run] | .[-30:])}')

          echo "$UPDATED" | jq -c '.' | base64 -w 0 > /tmp/sync_updated.b64
          jq -n --arg msg "[bot] sync-log: $TODAY" \
            --rawfile content /tmp/sync_updated.b64 \
            --arg branch "$TRACKING_BRANCH" \
            --arg sha "$SHA" \
            'if $sha == "" then {message:$msg, content:$content, branch:$branch}
             else {message:$msg, content:$content, branch:$branch, sha:$sha} end' \
            > /tmp/sync_payload.json

          if GH_TOKEN="$TRACKING_REPO_TOKEN" gh api \
            -X PUT \
            "/repos/$TRACKING_REPO/contents/sync-log.json" \
            --input /tmp/sync_payload.json > /tmp/sync_response.json 2>&1; then
            echo "Updated sync-log.json"
          else
            echo "::error::Failed to update sync-log.json"
            cat /tmp/sync_response.json
          fi
          echo "::endgroup::"
